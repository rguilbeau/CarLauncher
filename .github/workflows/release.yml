name: Build and Release APK

# Le script se déclenche sur tous les tags
on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour lire les métadonnées complètes des tags

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Rendre Gradle exécutable
        run: chmod +x ./gradlew

      - name: Compilation et Signature de l'APK Release
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(git rev-list --count HEAD)
          ./gradlew assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Renommer l'APK
        run: mv app/build/outputs/apk/release/app-release.apk CarLauncher.apk

      # --- ÉTAPE : Extraction du message du tag ---
      - name: Récupérer le message du tag
        id: tag_note
        run: |
          # Force la récupération des métadonnées complètes des tags
          git fetch --tags --force

          # Extrait le message du tag annoté
          MSG=$(git tag -l --format='%(contents)' ${{ github.ref_name }})

          # Repli 1 : Si le tag n'a pas de message, prends le message du dernier commit
          if [ -z "$(echo "$MSG" | tr -d '[:space:]')" ]; then
            MSG=$(git log -1 --format='%B' ${{ github.ref_name }})
          fi

          # Repli 2 : Si c'est toujours vide, utilise le nom du tag
          if [ -z "$(echo "$MSG" | tr -d '[:space:]')" ]; then
            MSG="Release ${{ github.ref_name }}"
          fi

          # Écriture multiligne sécurisée
          echo "note<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Création de la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: CarLauncher.apk
          # On utilise le message extrait du tag comme corps de la release
          body: ${{ steps.tag_note.outputs.note }}
          # Passe à true si tu veux AUSSI afficher la liste automatique des commits en dessous
          generate_release_notes: false